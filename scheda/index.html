<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b09">
<meta name="robots" content="noindex">
<title>Scheda conoscitiva</title>
<style>
:root { --bg:#070b09; --card:rgba(255,255,255,.055); --linea:rgba(255,255,255,.12); --testo:#f2f6f3; --muto:#93a39a; --verde:#3ddc84; --verde3:rgba(61,220,132,.15); --arancio:#f7a94f; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { background:var(--bg); }
body { margin:0 auto; max-width:560px; min-height:100vh; padding:calc(16px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom)); color:var(--testo);
       font:16px/1.45 system-ui,'Segoe UI',Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
body::before { content:""; position:fixed; inset:0; z-index:-1; background:radial-gradient(60% 45% at 12% 0%, rgba(61,220,132,.24), transparent 70%), radial-gradient(70% 45% at 60% 100%, rgba(61,220,132,.12), transparent 70%), var(--bg); }
.sopra { color:var(--verde); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px; }
h1 { font-size:30px; font-weight:800; letter-spacing:-.7px; line-height:1.12; margin:2px 0 8px; }
p { margin:6px 0; } .muto { color:var(--muto); font-size:14px; }
.barra { height:6px; background:rgba(255,255,255,.10); border-radius:6px; margin:12px 0 18px; overflow:hidden; }
.barra i { display:block; height:100%; background:linear-gradient(90deg,#2fc673,#7df0b0); border-radius:6px; transition:width .3s; }
.card { background:var(--card); border:1px solid var(--linea); border-radius:22px; padding:16px; margin:12px 0; }
label, .et { display:block; font-size:15px; font-weight:600; margin:0 0 8px; } label small, .et small { display:block; font-weight:400; color:var(--muto); font-size:13px; margin-top:2px; }
input, textarea { width:100%; min-height:50px; font:inherit; color:var(--testo); background:rgba(0,0,0,.35); border:1px solid var(--linea); border-radius:14px; padding:11px 13px; color-scheme:dark; }
textarea { min-height:86px; resize:vertical; }
input:focus, textarea:focus { outline:none; border-color:var(--verde); box-shadow:0 0 0 3px var(--verde3); }
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
button { font:inherit; color:var(--testo); background:rgba(255,255,255,.09); border:1px solid var(--linea); border-radius:14px; padding:12px 14px; min-height:48px; cursor:pointer; }
button:active { filter:brightness(1.25); }
.chip { border-radius:24px; min-height:44px; padding:8px 15px; font-size:15px; color:#c4d2c9; }
.chip.on { background:var(--verde3); border-color:var(--verde); color:var(--verde); font-weight:700; }
.cinque { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; } .cinque .chip { padding:0; font-size:18px; font-weight:700; border-radius:14px; min-height:50px; }
.pasto { display:grid; grid-template-columns:92px 1fr; gap:8px; margin-top:8px; } .pasto b { grid-column:1/-1; font-size:14px; color:var(--muto); font-weight:600; margin-top:6px; }
.avviso { border-color:rgba(247,169,79,.5); background:rgba(247,169,79,.10); font-size:15px; } .avviso b { color:var(--arancio); }
.pri { background:linear-gradient(180deg,#52e696,#2fc673); border-color:transparent; color:#04130a; font-weight:800; box-shadow:0 6px 22px rgba(61,220,132,.30); }
.largo { width:100%; margin-top:10px; min-height:56px; font-size:17px; border-radius:18px; }
#piede { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(12px + env(safe-area-inset-bottom)); background:rgba(7,11,9,.86); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); border-top:1px solid var(--linea); }
#piede div { max-width:528px; margin:0 auto; display:grid; grid-template-columns:1fr 2fr; gap:10px; } #piede button { min-height:54px; font-size:17px; border-radius:18px; }
pre { white-space:pre-wrap; font:13px/1.45 ui-monospace,Consolas,monospace; background:rgba(0,0,0,.35); border:1px solid var(--linea); border-radius:16px; padding:12px; max-height:300px; overflow:auto; }
#msg { position:fixed; left:50%; transform:translateX(-50%); top:calc(14px + env(safe-area-inset-top)); background:#f2f6f3; color:#0d1210; padding:10px 18px; border-radius:24px; font-size:14px; font-weight:700; display:none; z-index:5; max-width:90vw; text-align:center; }
@media (prefers-reduced-motion:reduce) { .barra i { transition:none; } }
</style>
</head>
<body>
<div id="vista"></div>
<div id="piede"><div><button id="bInd" onclick="vai(-1)">Indietro</button><button id="bAv" class="pri" onclick="vai(1)">Avanti</button></div></div>
<div id="msg"></div>
<script>
"use strict";
/* Scheda conoscitiva per un cliente nuovo. Pagina statica: le risposte restano sul telefono di chi compila (localStorage)
   finché non le manda lui, come testo, con Condividi o Copia. Qui dentro non c'è nessun dato personale.
   Campi: [id, tipo, domanda, aiuto, opzioni]. Tipi: t testo, n numero, d data, a testo lungo, u una scelta, m più scelte, s scala 1-5, p giornata dei pasti. */
const SI_NO = ["sì", "no"];
const PASTI = ["Colazione", "Metà mattina", "Pranzo", "Merenda", "Cena", "Dopo cena"];
const ALLARMI = ["dolore al petto sotto sforzo", "capogiri o svenimenti", "fiato corto a riposo", "formicolii o perdita di forza a un braccio o a una gamba", "dolore che ti sveglia di notte", "perdita di peso senza volerlo", "nessuno di questi"];
const SEZIONI = [
  { t: "Chi sei", c: [
    ["nome", "t", "Nome e cognome"], ["nascita", "d", "Data di nascita"], ["sesso", "u", "Sesso", "", ["uomo", "donna"]],
    ["altezza", "n", "Altezza (cm)"], ["peso", "n", "Peso di oggi (kg)", "Se non ti sei pesato di recente, scrivi quello che sai e quando l'hai misurato."],
    ["lavoro", "t", "Che lavoro fai, e con che orari"], ["lavoroTipo", "m", "Il tuo lavoro è", "", ["seduto", "in piedi", "fisico, pesante", "a turni o di notte", "spesso in viaggio"]] ] },
  { t: "Cosa vuoi ottenere", c: [
    ["obiettivo", "m", "Il tuo obiettivo", "Anche più di uno.", ["perdere grasso", "mettere muscolo", "tonificare, cambiare forma", "più forza", "salute ed energia", "una prestazione o una gara"]],
    ["obiettivoTuo", "a", "Dillo con parole tue", "Cosa vuoi vedere o sentire di diverso?"], ["scadenza", "t", "C'è una data o un'occasione?"],
    ["perche", "a", "Perché proprio adesso?"], ["mollare", "a", "Cosa ti ha fatto mollare le altre volte, o potrebbe farti mollare questa?"] ] },
  { t: "Storia del peso", c: [
    ["pesoMin", "t", "Peso più basso da adulto", "Quanti kg, e a che età."], ["pesoMax", "t", "Peso più alto", "Quanti kg, e a che età."],
    ["pesoAnno", "u", "Nell'ultimo anno il peso è", "", ["salito", "sceso", "fermo", "su e giù"]], ["pesoKg", "t", "Di quanti kg, più o meno"],
    ["diete", "a", "Diete già provate", "Quali, per quanto tempo, com'è andata."] ] },
  { t: "Allenamento", c: [
    ["esperienza", "u", "Ti alleni con i pesi da", "", ["mai fatto", "meno di 1 anno", "1-3 anni", "più di 3 anni"]],
    ["oggi", "a", "Cosa fai oggi", "Sport, palestra, corsa, niente: quante volte a settimana. Se sei fermo, da quanto."],
    ["giorni", "t", "Quanti giorni a settimana puoi dedicare, e quali"], ["minuti", "t", "Quanti minuti per seduta, e a che ora"],
    ["dove", "m", "Dove ti alleni quando sei da solo", "", ["palestra", "casa", "all'aperto"]],
    ["attrezzi", "a", "Se ti alleni a casa: che attrezzi hai?", "Manubri fino a quanti kg, bilanciere, panca, elastici, sbarra."],
    ["esercizi", "a", "Esercizi che ti piacciono, e esercizi che non sopporti"],
    ["carichi", "a", "Se ti ricordi qualche carico, scrivilo", "Per esempio: panca 50 kg per 8, squat 60 per 10. Se non lo sai, lascia vuoto."] ] },
  { t: "Salute", s: "Resta riservato: serve solo a non farti male.", c: [
    ["infortuni", "a", "Infortuni, operazioni o dolori, di oggi o del passato", "Spalla, schiena, ginocchio: quando, e come va adesso."],
    ["fastidi", "a", "Movimenti o esercizi che ti danno fastidio"], ["malattie", "a", "Malattie o condizioni diagnosticate", "Pressione, tiroide, diabete, cuore, asma, intestino, altro. Se nessuna, scrivi \"nessuna\"."],
    ["farmaci", "a", "Farmaci che prendi ogni giorno"], ["allergie", "t", "Allergie o intolleranze alimentari"],
    ["visita", "t", "Ultima visita medica o esami del sangue: quando"], ["certificato", "u", "Hai il certificato medico sportivo?", "", SI_NO],
    ["allarmi", "m", "Negli ultimi mesi ti è capitato", "Segna tutto quello che vale.", ALLARMI],
    ["ciclo", "u", "Ciclo", "", ["regolare", "irregolare", "assente", "menopausa"], "donna"], ["gravidanza", "u", "Gravidanza o allattamento", "", SI_NO, "donna"] ] },
  { t: "Come mangi oggi", s: "Una giornata normale, senza abbellirla. Quantità a occhio: \"un piatto\", \"due fette\", \"un cucchiaio\".", c: [
    ["pasti", "p", "La tua giornata"], ["cucina", "t", "Chi cucina a casa"], ["fuori", "t", "Quanti pasti fuori casa a settimana"],
    ["weekend", "a", "Nel weekend cambia qualcosa?", "Pizza, aperitivo, pranzo in famiglia, dolci."] ] },
  { t: "Gusti e abitudini", c: [
    ["ami", "a", "Cibi che ami e a cui non vuoi rinunciare"], ["no", "a", "Cibi che non mangi", "Non ti piacciono, non li digerisci, o per scelta."],
    ["acqua", "t", "Acqua al giorno (litri)"], ["caffe", "t", "Caffè al giorno, e bibite o succhi zuccherati"], ["alcol", "t", "Alcol: cosa e quante volte a settimana"],
    ["nervosa", "u", "Ti capita di mangiare senza fame, per stress, noia o stanchezza?", "", ["mai", "ogni tanto", "spesso"]],
    ["fame", "t", "In che momento della giornata hai più fame"], ["pesare", "u", "Pesare gli alimenti per qualche settimana ti andrebbe bene?", "", ["sì", "solo all'inizio", "no"]] ] },
  { t: "Sonno, stress e movimento", c: [
    ["letto", "t", "A che ora vai a letto, e a che ora ti svegli"], ["risvegli", "t", "Quante volte ti svegli di notte"],
    ["sonno", "s", "Come dormi", "1 malissimo · 5 benissimo"], ["stress", "s", "Stress in questo periodo", "1 poco · 5 tanto"],
    ["passi", "t", "Passi al giorno, se li conosci", "Li trovi nell'app Salute del telefono."], ["fumo", "t", "Fumi? Se sì, quante al giorno"],
    ["integratori", "a", "Integratori che prendi", "Proteine, creatina, vitamine, altro: quali e quanto."] ] },
  { t: "Misure e ultime cose", s: "Le misure sono facoltative, ma aiutano molto. Al mattino, a digiuno, metro orizzontale e senza tirare in dentro la pancia.", c: [
    ["vita", "n", "Giro vita, all'ombelico (cm)"], ["fianchi", "n", "Fianchi, nel punto più largo (cm)"],
    ["foto", "u", "Tre foto (fronte, lato, retro), stessa luce e stesso posto", "", ["le mando", "preferisco di no"]],
    ["altro", "a", "C'è qualcosa che non ti ho chiesto e che devo sapere?"] ] },
];
const CHIAVE = "scheda-conoscitiva-v1";
let R = {}, passo = 0;
try { const x = JSON.parse(localStorage.getItem(CHIAVE)); if (x && x.R) { R = x.R; passo = Math.min(x.passo || 0, SEZIONI.length); } } catch (e) {}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const salva = () => { try { localStorage.setItem(CHIAVE, JSON.stringify({ R, passo })); } catch (e) {} };
let tMsg = null;
function avvisa(m) { const a = $("msg"); a.textContent = m; a.style.display = "block"; clearTimeout(tMsg); tMsg = setTimeout(() => (a.style.display = "none"), 2400); }
const visibile = (c) => !c[5] || R.sesso === c[5];
const haAllarme = () => (R.allarmi || []).some((x) => x !== "nessuno di questi");

function campo(c) {
  const [id, tipo, dom, aiuto, op] = c, v = R[id], et = `<div class="et">${esc(dom)}${aiuto ? `<small>${esc(aiuto)}</small>` : ""}</div>`;
  let h = "";
  if (tipo === "t" || tipo === "n" || tipo === "d") h = `<input ${tipo === "n" ? 'inputmode="decimal"' : tipo === "d" ? 'type="date"' : ""} value="${esc(v)}" autocomplete="off" oninput="scrivi('${id}',this.value)" aria-label="${esc(dom)}">`;
  else if (tipo === "a") h = `<textarea oninput="scrivi('${id}',this.value)" aria-label="${esc(dom)}">${esc(v)}</textarea>`;
  else if (tipo === "u") h = `<div class="chips">${op.map((o, i) => `<button type="button" class="chip ${v === o ? "on" : ""}" onclick="scegli('${id}',${i})">${esc(o)}</button>`).join("")}</div>`;
  else if (tipo === "m") h = `<div class="chips">${op.map((o, i) => `<button type="button" class="chip ${(v || []).includes(o) ? "on" : ""}" onclick="piu('${id}',${i})">${esc(o)}</button>`).join("")}</div>`;
  else if (tipo === "s") h = `<div class="cinque">${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="chip ${v === n ? "on" : ""}" onclick="voto('${id}',${n})">${n}</button>`).join("")}</div>`;
  else if (tipo === "p") h = `<div class="pasto">${PASTI.map((p, i) => { const x = (v || [])[i] || {}; return `<b>${p}</b><input placeholder="ora" value="${esc(x.o)}" autocomplete="off" oninput="pasto(${i},'o',this.value)" aria-label="${p}: a che ora"><input placeholder="cosa mangi e bevi" value="${esc(x.c)}" autocomplete="off" oninput="pasto(${i},'c',this.value)" aria-label="${p}: cosa">`; }).join("")}</div>`;
  return `<div class="card">${et}${h}${id === "allarmi" && haAllarme() ? `<p class="muto" style="color:var(--arancio);margin-top:10px">Per quello che hai segnato, prima di cominciare serve il parere del tuo medico. Finisci pure la scheda.</p>` : ""}</div>`;
}
const trova = (id) => SEZIONI.flatMap((s) => s.c).find((c) => c[0] === id);
function scrivi(id, v) { R[id] = v; salva(); }
function scegli(id, i) { const o = trova(id)[4][i]; R[id] = R[id] === o ? "" : o; salva(); tieni(); }
function piu(id, i) {
  const o = trova(id)[4][i]; let v = R[id] || [];
  if (v.includes(o)) v = v.filter((x) => x !== o); else { v = id === "allarmi" ? (o === "nessuno di questi" ? [] : v.filter((x) => x !== "nessuno di questi")) : v; v = v.concat([o]); }
  R[id] = v; salva(); tieni();
}
function voto(id, n) { R[id] = R[id] === n ? "" : n; salva(); tieni(); }
function pasto(i, k, v) { const p = (R.pasti = R.pasti || []); p[i] = p[i] || {}; p[i][k] = v; salva(); }
function tieni() { const y = window.scrollY; disegna(); window.scrollTo(0, y); }
function vai(d) {
  if (d > 0 && passo === 0 && !String(R.nome || "").trim()) { avvisa("Scrivi almeno il tuo nome"); return; }
  passo = Math.max(0, Math.min(SEZIONI.length, passo + d)); salva(); disegna(); window.scrollTo(0, 0);
}
function disegna() {
  const N = SEZIONI.length, fine = passo >= N;
  $("bInd").style.visibility = passo ? "visible" : "hidden"; $("bAv").style.display = fine ? "none" : ""; $("bAv").textContent = passo === N - 1 ? "Ho finito" : "Avanti";
  $("piede").firstElementChild.style.gridTemplateColumns = fine ? "1fr" : "1fr 2fr";
  if (fine) {
    $("vista").innerHTML = `<div class="sopra">Fatto</div><h1>Manda le risposte</h1><div class="barra"><i style="width:100%"></i></div>
      <p class="muto">Le risposte sono solo su questo telefono. Tocca <b style="color:var(--testo)">Invia</b> e scegli la chat del tuo coach: arrivano come un messaggio di testo.</p>` +
      (haAllarme() ? `<div class="card avviso"><b>Prima di cominciare</b><br>Hai segnato uno o più sintomi da far vedere al medico. Mandami comunque la scheda: il piano parte dopo il suo via libera.</div>` : "") +
      `<button class="pri largo" onclick="invia()">Invia</button><button class="largo" onclick="copia()">Copia il testo</button>
      <h2 class="sopra" style="margin-top:22px">Quello che parte</h2><pre>${esc(testo())}</pre>
      <p class="muto">Questi dati servono solo a costruire e seguire il tuo percorso di allenamento e alimentazione. Non sostituiscono una visita medica.</p>
      <button class="largo" style="color:var(--muto)" onclick="azzera()">Cancella le risposte da questo telefono</button>`;
    return;
  }
  const S = SEZIONI[passo];
  $("vista").innerHTML = `<div class="sopra">Parte ${passo + 1} di ${N}</div><h1>${esc(S.t)}</h1><div class="barra"><i style="width:${Math.round((passo / N) * 100)}%"></i></div>` +
    (passo === 0 ? `<p class="muto">Serve a costruire allenamento e alimentazione su di te: 10 minuti. Dove non sai, lascia vuoto o scrivi "non so". Meglio un numero che un "abbastanza". Puoi chiudere e riprendere: le risposte restano su questo telefono.</p>` : "") +
    (S.s ? `<p class="muto">${esc(S.s)}</p>` : "") + S.c.filter(visibile).map(campo).join("");
}
function testo() {
  let t = "SCHEDA CONOSCITIVA" + (R.nome ? " — " + String(R.nome).trim() : "") + "\ncompilata il " + new Date().toLocaleDateString("sv") + "\n";
  for (const S of SEZIONI) {
    t += "\n## " + S.t + "\n";
    for (const c of S.c.filter(visibile)) {
      const v = R[c[0]];
      if (c[1] === "p") { t += c[2] + ":\n" + PASTI.map((p, i) => { const x = (v || [])[i] || {}; return "  " + p + (x.o ? " (" + x.o + ")" : "") + ": " + (x.c || "—"); }).join("\n") + "\n"; continue; }
      const s = Array.isArray(v) ? v.join(", ") : v == null ? "" : String(v).trim();
      t += c[2] + ": " + (s || "—") + "\n";
    }
  }
  if (haAllarme()) t += "\nATTENZIONE: ha segnato sintomi da far valutare al medico prima di cominciare.\n";
  return t.trim();
}
async function invia() {
  if (navigator.share) { try { await navigator.share({ title: "Scheda conoscitiva", text: testo() }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  copia();
}
async function copia() { try { await navigator.clipboard.writeText(testo()); avvisa("Copiato: incollalo nella chat del coach"); } catch (e) { avvisa("Non riesco a copiare: seleziona il testo qui sotto"); } }
function azzera() { if (!confirm("Cancello tutte le risposte da questo telefono?")) return; R = {}; passo = 0; try { localStorage.removeItem(CHIAVE); } catch (e) {} disegna(); window.scrollTo(0, 0); }
disegna();
</script>
</body>
</html>
