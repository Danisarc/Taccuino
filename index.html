<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b09">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Taccuino palestra</title>
<style>
:root { --bg:#070b09; --solido:#111815; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09); --linea:rgba(255,255,255,.10);
        --testo:#f2f6f3; --muto:#93a39a; --verde:#3ddc84; --verde2:#1f8f55; --verde3:rgba(61,220,132,.15);
        --arancio:#f7a94f; --rosso:#ff6b5e; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { background:var(--bg); }
body { margin:0 auto; color:var(--testo); font:16px/1.4 system-ui,'Segoe UI',Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased;
       padding:calc(18px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom)); max-width:560px; min-height:100vh; }
body.inseduta { padding-bottom:calc(390px + env(safe-area-inset-bottom)); }
/* sfondo con luci colorate: è quello che il vetro della barra lascia intravedere */
body::before { content:""; position:fixed; inset:0; z-index:-1; background:
  radial-gradient(60% 45% at 12% 0%, rgba(61,220,132,.26), transparent 70%),
  radial-gradient(55% 40% at 100% 28%, rgba(46,150,210,.18), transparent 70%),
  radial-gradient(70% 45% at 40% 100%, rgba(61,220,132,.16), transparent 70%),
  radial-gradient(40% 30% at 0% 70%, rgba(247,169,79,.10), transparent 70%), var(--bg); }
h1 { font-size:32px; font-weight:800; margin:0 0 16px; letter-spacing:-.8px; line-height:1.1; }
h2 { font-size:12px; margin:26px 4px 10px; color:var(--muto); text-transform:uppercase; letter-spacing:1.1px; font-weight:700; }
h3 { font-size:16px; margin:16px 0 6px; }
p { margin:6px 0; }
.muto { color:var(--muto); font-size:13px; }
.sopra { color:var(--verde); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:2px; }
.card { background:var(--card); border:1px solid var(--linea); border-radius:22px; padding:16px; margin:12px 0; }
.riga { display:flex; gap:8px; align-items:center; }
.tra { justify-content:space-between; }
button { font:inherit; color:var(--testo); background:var(--card2); border:1px solid var(--linea); border-radius:14px;
         padding:12px 14px; min-height:48px; cursor:pointer; transition:transform .08s, filter .08s; }
button:active { filter:brightness(1.25); transform:scale(.97); }
button.pri { background:linear-gradient(180deg,#52e696,#2fc673); border-color:transparent; color:#04130a; font-weight:800;
             box-shadow:0 6px 22px rgba(61,220,132,.30), inset 0 1px 0 rgba(255,255,255,.35); }
button.per { background:transparent; border-color:rgba(255,107,94,.35); color:var(--rosso); }
button.pic { min-height:38px; padding:6px 13px; font-size:14px; border-radius:20px; }
button.largo { width:100%; margin-top:10px; }
button.grosso { min-height:58px; font-size:18px; border-radius:18px; margin-top:14px; }
button.ico { min-height:38px; width:42px; padding:0; font-size:20px; line-height:1; background:transparent; border-color:transparent; color:var(--muto); }
input,textarea { min-width:0; font:inherit; color:var(--testo); background:rgba(0,0,0,.35); border:1px solid var(--linea); border-radius:14px;
         padding:10px 12px; width:100%; min-height:48px; color-scheme:dark; }
input:focus,textarea:focus { outline:none; border-color:var(--verde); box-shadow:0 0 0 3px var(--verde3); }
textarea { min-height:70px; }
label { display:block; font-size:13px; color:var(--muto); margin:12px 0 5px; }
.nome { font-weight:700; font-size:16px; }
.badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:rgba(247,169,79,.16); color:var(--arancio); margin-left:6px; font-weight:700; vertical-align:middle; }
.pillola { font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px; background:rgba(255,255,255,.10); color:var(--testo); white-space:nowrap; }
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* home: la settimana */
.sett { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin:0 0 6px; }
.sett div { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; height:62px; border-radius:16px;
            background:var(--card); border:1px solid var(--linea); }
.sett small { font-size:11px; color:var(--muto); font-weight:600; }
.sett b { font-size:16px; line-height:20px; }
.sett b.p { font-size:10px; font-weight:600; color:var(--muto); }
.sett .pass { opacity:.45; }
.sett .ok { background:var(--verde3); border-color:rgba(61,220,132,.35); }
.sett .ok b { color:var(--verde); font-size:16px; }
.sett div { cursor:pointer; }
.sett .sel { border-color:var(--verde); box-shadow:0 0 0 1px var(--verde) inset; opacity:1; }
button.dietro { font-size:34px; width:40px; min-height:44px; margin-left:-10px; color:var(--testo); padding-bottom:6px; }
.sett .oggi small { color:var(--verde); }
.conta { margin:0 4px 4px; }
.conta b { color:var(--testo); }

/* home: la seduta di oggi */
.eroe { background:linear-gradient(150deg,rgba(61,220,132,.24),rgba(61,220,132,.05) 55%,rgba(255,255,255,.04)); border-color:rgba(61,220,132,.32);
        padding:18px; border-radius:26px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
.eroe .eti { font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--verde); }
.eroe .grande { font-size:25px; font-weight:800; letter-spacing:-.4px; line-height:1.15; margin:10px 0 6px; }
.eroe .num { display:flex; gap:18px; margin:12px 0 4px; }
.eroe .num div { font-size:12px; color:var(--muto); }
.eroe .num b { display:block; font-size:22px; color:var(--testo); line-height:1.1; }
details { margin-top:12px; border-top:1px solid var(--linea); }
summary { list-style:none; cursor:pointer; padding:12px 0 4px; font-size:14px; font-weight:600; display:flex; justify-content:space-between; }
summary::-webkit-details-marker { display:none; }
summary::after { content:"⌄"; color:var(--muto); font-size:18px; line-height:1; transition:transform .2s; }
details[open] summary::after { transform:rotate(180deg); }
ol.piano { list-style:none; margin:4px 0 0; padding:0; counter-reset:n; }
ol.piano li { counter-increment:n; display:flex; align-items:center; gap:10px; margin:0; padding:8px 0; font-size:14px; border-bottom:1px solid rgba(255,255,255,.06); }
ol.piano li:last-child { border-bottom:0; }
ol.piano li::before { content:counter(n); flex:none; width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,.10); font-size:12px; font-weight:700;
                      display:flex; align-items:center; justify-content:center; }
ol.piano span { flex:1; min-width:0; }
ol.piano b { flex:none; color:var(--muto); font-weight:600; font-size:13px; font-variant-numeric:tabular-nums; }

/* home: le altre sedute */
.altre { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.altre button { display:flex; align-items:center; gap:10px; text-align:left; padding:12px; border-radius:18px; background:var(--card); min-height:64px; }
.altre i { flex:none; width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.10); font-style:normal; font-weight:800; font-size:17px;
           display:flex; align-items:center; justify-content:center; }
.altre b { display:block; font-size:14px; line-height:1.2; }
.altre small { color:var(--muto); font-size:12px; }

/* seduta */
.top { position:sticky; top:0; z-index:4; background:rgba(7,11,9,.78); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
       margin:calc(-18px - env(safe-area-inset-top)) -16px 6px; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid var(--linea); }
.top .tit { font-size:20px; font-weight:800; letter-spacing:-.3px; }
.barra { height:6px; background:rgba(255,255,255,.10); border-radius:6px; margin-top:10px; overflow:hidden; }
.barra i { display:block; height:100%; background:linear-gradient(90deg,#2fc673,#7df0b0); border-radius:6px; transition:width .35s; }
.ex { padding:14px 8px 14px 14px; transition:border-color .2s, background .2s; }
.ex .n { flex:none; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.10); font-size:13px; font-weight:800;
         display:flex; align-items:center; justify-content:center; }
.ex .nome { flex:1; min-width:0; }
.ex .det { margin-left:36px; }
.ex.att { border-color:rgba(61,220,132,.55); background:linear-gradient(150deg,rgba(61,220,132,.16),rgba(61,220,132,.04)); box-shadow:0 8px 30px rgba(0,0,0,.3); }
.ex.att .n { background:var(--verde); color:#04130a; }
.ex.fatto { opacity:.72; }
.ex.fatto .n { background:var(--verde3); color:var(--verde); }
.ex .consiglio { color:#c4d2c9; margin-top:6px; padding:8px 10px; border-radius:12px; background:rgba(255,255,255,.06); }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.chip { min-height:42px; min-width:60px; padding:4px 12px; border-radius:21px; font-size:14px; font-variant-numeric:tabular-nums; color:var(--muto); background:rgba(255,255,255,.06); }
.chip.ok { background:var(--verde3); border-color:rgba(61,220,132,.4); color:var(--verde); font-weight:700; }
.chip.cur { border-color:var(--verde); color:var(--testo); box-shadow:0 0 0 1px var(--verde) inset; }
.chip.piu { min-width:42px; border-style:dashed; background:transparent; }

/* pannello della serie */
#pan { position:fixed; left:0; right:0; bottom:calc(82px + env(safe-area-inset-bottom)); z-index:6; display:none; padding:0 12px; pointer-events:none; }
#pan .dentro { pointer-events:auto; max-width:440px; margin:0 auto; background:rgba(17,24,21,.86); -webkit-backdrop-filter:blur(26px) saturate(160%); backdrop-filter:blur(26px) saturate(160%);
               border:1px solid rgba(255,255,255,.14); border-radius:28px; padding:12px; box-shadow:0 12px 40px rgba(0,0,0,.55); }
#rec { display:none; align-items:center; justify-content:space-between; background:var(--verde3); border:1px solid rgba(61,220,132,.4); border-radius:18px; padding:4px 6px 4px 14px; margin-bottom:10px; color:var(--verde); }
#rec.fine { background:rgba(247,169,79,.16); border-color:var(--arancio); color:var(--arancio); }
#rec b { font-size:24px; font-variant-numeric:tabular-nums; margin-left:8px; color:var(--testo); }
.ptit { font-size:13px; color:var(--muto); margin:0 4px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ptit b { font-size:15px; color:var(--testo); }
.ctl { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ctl.uno { grid-template-columns:1fr; }
.st { display:grid; grid-template-columns:48px minmax(0,1fr) 48px; gap:4px; align-items:center; background:rgba(0,0,0,.30); border-radius:18px; padding:4px; }
.st button { padding:0; min-height:50px; font-size:24px; font-weight:600; border-radius:14px; }
.st input { text-align:center; font-size:24px; font-weight:800; padding:2px; min-height:50px; background:transparent; border-color:transparent; }
.st small { grid-column:1/-1; text-align:center; color:var(--muto); font-size:11px; margin-top:-4px; padding-bottom:2px; }
.ult { display:flex; gap:8px; align-items:flex-end; margin-top:10px; }
.rir { display:flex; gap:4px; }
.rir button { min-height:52px; width:36px; padding:0; font-weight:700; color:var(--muto); border-radius:12px; }
.rir button.on { background:var(--verde3); border-color:var(--verde); color:var(--verde); }
.ult .pri { flex:1; min-height:52px; font-size:17px; border-radius:16px; }
.lbl { font-size:11px; color:var(--muto); margin:0 0 3px 2px; }

/* barra in basso: vetro liquido (adattata da webgl-liquid-glass, licenza MIT) */
#nav { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom)); width:min(calc(100% - 24px),440px); height:60px;
       display:flex; align-items:center; padding:0 6px; border-radius:30px; z-index:7; cursor:pointer;
       -webkit-backdrop-filter:blur(40px) saturate(170%); backdrop-filter:blur(40px) saturate(170%); background:rgba(255,255,255,.11);
       box-shadow:0 8px 32px rgba(0,0,0,.40), inset 0 0 0 .5px rgba(255,255,255,.22);
       -webkit-user-select:none; user-select:none; touch-action:none; }
#nav .pill { position:absolute; top:6px; left:0; height:48px; border-radius:24px; background:rgba(255,255,255,.09); pointer-events:none;
             -webkit-backdrop-filter:brightness(1.2) saturate(1.4); backdrop-filter:brightness(1.2) saturate(1.4);
             box-shadow:inset 0 1px 1px rgba(255,255,255,.25), inset 0 -.5px 1px rgba(255,255,255,.10), 0 4px 16px rgba(0,0,0,.12);
             will-change:transform,width; transform-origin:center center; }
#nav canvas { position:absolute; top:0; left:0; width:100%; height:100%; border-radius:30px; pointer-events:none; }
#nav button, #nav .att div { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
       border:0; border-radius:24px; background:none; padding:0; min-height:48px; font-size:10.5px; line-height:1; box-shadow:none; transform:none; filter:none; }
#nav button { position:relative; z-index:1; color:rgba(255,255,255,.58); font-weight:500; }
#nav button:focus-visible { outline:none; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9); }
#nav svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
#nav .att { position:absolute; inset:0; display:flex; align-items:center; padding:0 6px; pointer-events:none; z-index:2;
            -webkit-clip-path:url(#navClip); clip-path:url(#navClip); }
#nav .att div { color:var(--verde); font-weight:700; }
#nav .att svg { stroke-width:2.3; }

/* foglio dal basso e avvisi */
#velo { position:fixed; inset:0; background:rgba(0,0,0,.6); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); z-index:8; display:none; }
#foglio { position:fixed; left:0; right:0; bottom:0; z-index:9; display:none; max-height:85vh; overflow:auto; background:var(--solido); border-radius:28px 28px 0 0;
          border:1px solid var(--linea); padding:22px 16px calc(18px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
#foglio::before { content:""; display:block; width:40px; height:4px; border-radius:4px; background:rgba(255,255,255,.22); margin:-10px auto 14px; }
#avviso { position:fixed; left:50%; transform:translateX(-50%); top:calc(14px + env(safe-area-inset-top)); z-index:10; background:#f2f6f3; color:#0d1210; padding:10px 18px;
          border-radius:24px; font-size:14px; font-weight:700; display:none; max-width:90vw; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.5); }

table { width:100%; border-collapse:collapse; font-size:14px; }
td,th { padding:8px 4px; border-bottom:1px solid var(--linea); text-align:left; }
tr:last-child td { border-bottom:0; }
th { color:var(--muto); font-weight:600; font-size:12px; }
pre { white-space:pre-wrap; font-size:12px; background:rgba(0,0,0,.35); border:1px solid var(--linea); border-radius:16px; padding:12px; max-height:280px; overflow:auto; }
ul { margin:6px 0; padding-left:20px; } li { margin:4px 0; }
.vuoto { text-align:center; padding:34px 16px; color:var(--muto); }
.vuoto b { display:block; color:var(--testo); font-size:17px; margin-bottom:4px; }

/* home: profilo e i due blocchi con la foto */
.profilo { cursor:pointer; padding:14px 16px; margin-top:0; }
.avatar { flex:none; width:52px; height:52px; border-radius:50%; background:linear-gradient(140deg,#52e696,#1f8f55); color:#04130a; font-style:normal; font-weight:800; font-size:24px;
          display:flex; align-items:center; justify-content:center; }
.profilo .chi { flex:1; min-width:0; margin-left:6px; } .profilo .chi b { display:block; font-size:19px; line-height:1.2; } .profilo .chi small { color:var(--muto); font-size:13px; }
.profilo em { font-style:normal; font-size:28px; color:var(--muto); line-height:1; padding-bottom:4px; }
.tre { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; padding-top:12px; border-top:1px solid var(--linea); font-size:11px; color:var(--muto); line-height:1.25; }
.tre b { display:block; font-size:19px; color:var(--testo); font-variant-numeric:tabular-nums; margin-bottom:2px; }
.foto { position:relative; height:190px; padding:0; border-radius:24px; overflow:hidden; border-color:var(--linea); background:#141b18 center/cover no-repeat; text-align:left; }
.foto::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(7,11,9,.10) 25%,rgba(7,11,9,.92)); }
.foto span { position:absolute; left:14px; right:12px; bottom:12px; }
.foto b { display:block; font-size:18px; line-height:1.2; } .foto small { color:#cfdad3; font-size:12px; }
.altre.tre3 { grid-template-columns:repeat(3,1fr); gap:8px; }
.altre.tre3 button { flex-direction:column; align-items:flex-start; gap:8px; padding:12px 10px; min-height:104px; }
.altre button.qui { border-color:var(--verde); box-shadow:0 0 0 1px var(--verde) inset; } .altre button.qui i { background:var(--verde); color:#04130a; }
ol.piano small.muto { font-size:12px; }
/* home: blocchi del piano e numeri */
.blocco { display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:14px; margin:10px 0; border-radius:22px; background:var(--card); min-height:76px; }
.blocco i { flex:none; width:46px; height:46px; border-radius:15px; background:var(--verde3); color:var(--verde); display:flex; align-items:center; justify-content:center; }
.blocco svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.blocco span { flex:1; min-width:0; } .blocco b { display:block; font-size:17px; } .blocco small { color:var(--muto); font-size:13px; }
.blocco em { flex:none; font-style:normal; font-size:28px; color:var(--muto); line-height:1; padding-bottom:4px; }
.tile { text-align:left; padding:14px; border-radius:20px; background:var(--card); display:flex; flex-direction:column; gap:2px; min-height:96px; }
.tile small { color:var(--muto); font-size:12px; } .tile b { font-size:20px; line-height:1.2; } .tile span { color:var(--muto); font-size:12px; }
.testata { margin-bottom:14px; } .testata h1 { margin:0; }
.interr { display:flex; align-items:center; gap:12px; cursor:pointer; padding:14px 16px; }
.interr span { flex:1; min-width:0; } .interr b { display:block; font-size:16px; } .interr small { color:var(--muto); font-size:13px; }
.leva { flex:none; width:50px; height:30px; border-radius:15px; background:rgba(255,255,255,.16); position:relative; transition:background .15s; }
.leva::after { content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#f2f6f3; transition:transform .15s; }
.interr.on { border-color:rgba(61,220,132,.5); } .interr.on .leva { background:var(--verde); } .interr.on .leva::after { transform:translateX(20px); }
input.qta { flex:none; width:68px; min-height:38px; padding:4px 8px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; border-color:rgba(61,220,132,.45); }
.pasto li em { flex:none; font-style:normal; font-size:12px; color:var(--muto); margin-left:-4px; min-width:22px; }
button.piuCibo { border-style:dashed; background:transparent; color:var(--verde); font-weight:600; min-height:44px; margin-top:12px; }
.tre3c { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; } .tre3c button { padding:10px 4px; font-size:14px; }
#cam { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:18px; background:#000; display:block; margin:12px 0; }
.pasto li .ico { flex:none; margin:-8px -8px -8px 0; }
/* piano alimentare: conto della giornata, caselle da spuntare, acqua */
.kc { font-size:15px; color:var(--muto); } .kc b { font-size:28px; color:var(--testo); font-variant-numeric:tabular-nums; letter-spacing:-.5px; }
.mt { margin-top:12px; font-size:14px; } .mt b { font-variant-numeric:tabular-nums; } .mt small { color:var(--muto); font-weight:400; font-size:12px; } .mt .barra { margin-top:5px; height:5px; }
.conto details .mt:first-of-type { margin-top:4px; }
.pasto li.sp { cursor:pointer; align-items:center; gap:10px; justify-content:flex-start; } .pasto li.sp span { flex:1; min-width:0; }
.chk { flex:none; width:24px; height:24px; border-radius:8px; border:2px solid rgba(255,255,255,.28); display:flex; align-items:center; justify-content:center; font-style:normal; }
.chk.tondo1 { border-radius:50%; }
.sp.on .chk { background:var(--verde); border-color:var(--verde); } .sp.on .chk::after { content:"✓"; color:#04130a; font-size:15px; font-weight:800; line-height:1; }
.sp.on span { color:var(--testo); } .pasto li.sp:not(.on) span { color:#c4d2c9; }

  let mn = da0 ? 0 : Math.min(...ys), mx = Math.max(...ys); if (mx === mn) { mx += 1; if (!da0) mn -= 1; }

  const a = assi(pts), linea = (k) => pts.map((p, i) => (p[k] == null ? null : a.X(p, i).toFixed(1) + "," + a.Y(p[k]).toFixed(1))).filter(Boolean).join(" ");

  else c += `<polyline class="ln" points="${linea("y")}"/>` + pts.map((p, i) => `<circle class="pt" cx="${a.X(p, i).toFixed(1)}" cy="${a.Y(p.y).toFixed(1)}" r="4"/>`).join("");

}
function grafBarre(id, pts, o) {

  const a = assi(pts, true, o.rif), passo = (a.W - a.L - a.R) / pts.length, lw = Math.min(22, passo * 0.62), base = a.Y(0);
  const cx = (i) => a.L + passo * (i + 0.5); a.X = (p, i) => cx(i);
  let c = pts.map((p, i) => { const y = a.Y(p.y), h = base - y; return h > 0.5 ? `<path class="br" d="M${(cx(i) - lw / 2).toFixed(1)} ${base.toFixed(1)}v${(-h + Math.min(4, h)).toFixed(1)}q0 ${-Math.min(4, h)} ${Math.min(4, lw / 2)} ${-Math.min(4, h)}h${(lw - 2 * Math.min(4, lw / 2)).toFixed(1)}q${Math.min(4, lw / 2)} 0 ${Math.min(4, lw / 2)} ${Math.min(4, h)}v${(h - Math.min(4, h)).toFixed(1)}z"/>` : ""; }).join("");
  if (o.rif != null) c += `<line class="rif" x1="${a.L}" x2="${a.W - a.R}" y1="${a.Y(o.rif).toFixed(1)}" y2="${a.Y(o.rif).toFixed(1)}"/>`;

}
function toccaGraf(ev, id) {
  const G = GRAF[id]; if (!G) return;
  const r = ev.currentTarget.getBoundingClientRect(), x = ((ev.clientX - r.left) / r.width) * G.W;
  let k = 0; G.xs.forEach((v, i) => { if (Math.abs(v - x) < Math.abs(G.xs[k] - x)) k = i; });
  const cr = $("cr-" + id), p = G.pts[k]; cr.setAttribute("x1", G.xs[k]); cr.setAttribute("x2", G.xs[k]); cr.setAttribute("visibility", "visible");
  $("tip-" + id).innerHTML = `<b>${p.x}</b> · ${G.testo(p)}`;
}

  if (dd.length) {

    for (const d of dd) { const x = S.diario[d]; t += `${d} | ${it(x.peso)} | ${it(x.passi)} | ${it(x.sonno)} | ${x.note || ""}\n`; }
  }
  const cc = Object.keys(S.cibo || {}).filter((d) => d > da).sort().filter((d) => totali(d)[0] > 0 || S.cibo[d].acqua);
  if (cc.length) {

  }
  return t.trim();

  try {
    const r = await fetch("https://world.openfoodfacts.org/api/v2/product/" + cod + ".json?fields=product_name,product_name_it,brands,serving_quantity,nutriments");
    const j = await r.json(), p = j.product, n = p && p.nutriments;
    if (!n || n["energy-kcal_100g"] == null) { formAlimento({ codice: cod }); avvisa("Prodotto non trovato: scrivi i valori dell'etichetta"); return; }
    const g = (k) => +n[k] || 0, mg = (k) => (+n[k] || 0) * 1000;
    const per100 = [g("energy-kcal_100g"), g("proteins_100g"), g("carbohydrates_100g"), g("fat_100g"), g("fiber_100g"), mg("calcium_100g"), mg("iron_100g"), mg("magnesium_100g"), mg("potassium_100g"), mg("vitamin-c_100g")];
    formAlimento({ codice: cod, trovato: 1, porz: +p.serving_quantity || null, per100, cat: indovinaCat(per100),
      nome: [p.brands ? p.brands.split(",")[0].trim() : "", p.product_name_it || p.product_name || ""].filter(Boolean).join(" · ") });
  } catch (e) { formAlimento({ codice: cod }); avvisa("Serve la rete per cercare: scrivi i valori a mano"); }
}
function scegliCat(c) { bozza.cat = c; for (const k in CAT) { const b = $("cat-" + k); if (b) { b.classList.toggle("pri", k === c); b.setAttribute("aria-pressed", k === c); } } }
function formAlimento(a) {
  bozza = { codice: a.codice || "", per100: (a.per100 || new Array(10).fill(0)).slice(), cat: a.cat || "altro" };
  const v = bozza.per100, campo = (id, et, val, ph) => `<div><label>${et}</label><input id="${id}" inputmode="decimal" autocomplete="off" value="${val ? esc(it(Math.round(val * 10) / 10)) : ""}" placeholder="${ph || "0"}"></div>`;
  apri(testaFoglio("Aggiungi a " + nomePasto()) + (a.trovato ? `<p class="muto">Trovato su Open Food Facts. Bastano i grammi e il tipo; controlla che i valori siano quelli dell'etichetta.</p>` : "") +
    `<label>Nome</label><input id="aNome" value="${esc(a.nome || "")}" placeholder="Es. Mozzarella proteica" autocomplete="off">
    ${campo("aG", "Quanti grammi", a.porz, "100")}
    <label>Che cos'è</label><div class="tre3c">${Object.keys(CAT).map((k) => `<button type="button" id="cat-${k}" class="${k === bozza.cat ? "pri" : ""}" aria-pressed="${k === bozza.cat}" onclick="scegliCat('${k}')">${CAT[k]}</button>`).join("")}</div>
    <p class="muto">Carboidrato e proteina prendono il posto della scelta del piano in quel pasto.</p>
    <h2>Valori per 100 g, dall'etichetta</h2>
    <div class="g2">${campo("aK", "Calorie (kcal)", v[0])}${campo("aP", "Proteine (g)", v[1])}${campo("aC", "Carboidrati (g)", v[2])}${campo("aF", "Grassi (g)", v[3])}</div>
    ${campo("aFi", "Fibra (g), se c'è", v[4])}
    <p class="muto">Se conosci solo i valori della porzione intera (una pizza, un piatto al ristorante), scrivi quelli e metti 100 nei grammi.</p>
    <label class="riga" style="gap:10px;color:var(--testo)"><input type="checkbox" id="aSalva" checked style="width:24px;min-height:24px;flex:none"> Tienilo tra i miei alimenti</label>
    <button class="pri largo" onclick="confAlimento()">Aggiungi a ${nomePasto()}</button><button class="largo" onclick="aggiungiCibo()">Indietro</button>`, true);
  if (a.nome) setTimeout(() => { const g = $("aG"); if (g && !g.value) g.focus(); }, 60);       // alimento già noto: si parte dai grammi
}
function confAlimento() {
  const nome = $("aNome").value.trim(), g = num($("aG").value), p = bozza.per100, cat = bozza.cat;
  if (!nome) { avvisa("Scrivi il nome"); return; }
  if (!g || g <= 0) { avvisa("Scrivi quanti grammi"); return; }
  ["aK", "aP", "aC", "aF", "aFi"].forEach((id, i) => (p[i] = Math.max(0, num($(id).value) || 0)));
  if (!p[0]) p[0] = Math.round(p[1] * 4 + p[2] * 4 + p[3] * 9);          // calorie mancanti: le ricava dai macro
  if (!p[0]) { avvisa("Scrivi almeno le calorie"); return; }
  const r = recCibo(oggi(), true), pasto = PASTI.find((x) => x.id === dove) || PASTI[2];
  (r.extra = r.extra || []).push({ id: Date.now(), nome, q: it(g) + " g", v: p.map((x) => (x * g) / 100), pasto: pasto.id, cat });
  // carboidrato o proteina: prende il posto della scelta del piano in quel pasto (non nel giorno personalizzato)
  const gruppo = pasto.g.find((x) => x.k === cat);
  if (gruppo && !r.pers) for (const o of gruppo.v) delete r.x[o[0]];
  if ($("aSalva").checked) {
    S.alimenti = (S.alimenti || []).filter((x) => (bozza.codice ? x.codice !== bozza.codice : x.nome.toLowerCase() !== nome.toLowerCase()));
    S.alimenti.unshift({ nome, per100: p.slice(), porz: g, codice: bozza.codice, cat }); S.alimenti = S.alimenti.slice(0, 40);
  }
  salva(); chiudi(); tieni(disegna); avvisa("Aggiunto a " + pasto.nome.toLowerCase());
}
function togliExtra(id) { const r = recCibo(oggi(), true); r.extra = (r.extra || []).filter((x) => x.id !== id); salva(); tieni(disegna); }

/* ============ TASTO INDIETRO DEL TELEFONO ============
   Si tiene sempre una voce in più nella cronologia: il tasto indietro la consuma, l'app chiude ciò che è aperto
   e la rimette. Solo dalla home, senza nulla di aperto, il tasto esce dall'app. */
function passoIndietro() {
  if ($("foglio").style.display === "block") { chiudi(); return true; }
  if (tab === "allena" && S.corso) { indietro(); return true; }
  if (tab === "tecnica" && guida) { apriGuida(null); return true; }
  if (tab !== "allena") { vai("allena"); return true; }
  if (sub) { apriSub(null); return true; }
  return false;
}
try {
  history.replaceState({ base: 1 }, ""); history.pushState({ app: 1 }, "");
  window.addEventListener("popstate", () => { if (passoIndietro()) history.pushState({ app: 1 }, ""); else history.back(); });
} catch (e) {}

disegna(); sveglio();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
