<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b09">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Taccuino palestra</title>
<style>
:root { --bg:#070b09; --solido:#111815; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09); --linea:rgba(255,255,255,.10);
        --testo:#f2f6f3; --muto:#93a39a; --verde:#3ddc84; --verde2:#1f8f55; --verde3:rgba(61,220,132,.15);
        --arancio:#f7a94f; --rosso:#ff6b5e; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { background:var(--bg); overflow-x:hidden; overflow-x:clip; }
body { margin:0 auto; color:var(--testo); font:16px/1.4 system-ui,'Segoe UI',Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased;
       padding:calc(18px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom)); max-width:560px; min-height:100vh; min-height:100dvh; }
body.inseduta { padding-bottom:calc(180px + env(safe-area-inset-bottom)); }
/* sfondo con luci colorate: è quello che il vetro della barra lascia intravedere */
body::before { content:""; position:fixed; inset:0; z-index:-1; background:
  radial-gradient(60% 45% at 12% 0%, rgba(61,220,132,.26), transparent 70%),
  radial-gradient(55% 40% at 100% 28%, rgba(46,150,210,.18), transparent 70%),
  radial-gradient(70% 45% at 40% 100%, rgba(61,220,132,.16), transparent 70%),
  radial-gradient(40% 30% at 0% 70%, rgba(247,169,79,.10), transparent 70%), var(--bg); }
h1 { font-size:32px; font-weight:800; margin:0 0 16px; letter-spacing:-.8px; line-height:1.1; }
h2 { font-size:12px; margin:26px 4px 10px; color:var(--muto); text-transform:uppercase; letter-spacing:1.1px; font-weight:700; }
h3 { font-size:16px; margin:16px 0 6px; }
p { margin:6px 0; }
.muto { color:var(--muto); font-size:13px; }
.sopra { color:var(--verde); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:2px; }
.card { background:var(--card); border:1px solid var(--linea); border-radius:22px; padding:16px; margin:12px 0; }
.riga { display:flex; gap:8px; align-items:center; }
.tra { justify-content:space-between; }
button { font:inherit; color:var(--testo); background:var(--card2); border:1px solid var(--linea); border-radius:14px;
         padding:12px 14px; min-height:48px; cursor:pointer; transition:transform .08s, filter .08s; }
button:active { filter:brightness(1.25); transform:scale(.97); }
button.pri { background:linear-gradient(180deg,#52e696,#2fc673); border-color:transparent; color:#04130a; font-weight:800;
             box-shadow:0 6px 22px rgba(61,220,132,.30), inset 0 1px 0 rgba(255,255,255,.35); }
button.per { background:transparent; border-color:rgba(255,107,94,.35); color:var(--rosso); }
button.pic { min-height:38px; padding:6px 13px; font-size:14px; border-radius:20px; }
button.largo { width:100%; margin-top:10px; }
button.grosso { min-height:58px; font-size:18px; border-radius:18px; margin-top:14px; }
button.ico { min-height:38px; width:42px; padding:0; font-size:20px; line-height:1; background:transparent; border-color:transparent; color:var(--muto); }
input,textarea { min-width:0; font:inherit; color:var(--testo); background:rgba(0,0,0,.35); border:1px solid var(--linea); border-radius:14px;
         padding:10px 12px; width:100%; min-height:48px; color-scheme:dark; }
input:focus,textarea:focus { outline:none; border-color:var(--verde); box-shadow:0 0 0 3px var(--verde3); }
textarea { min-height:70px; }
label { display:block; font-size:13px; color:var(--muto); margin:12px 0 5px; }
.nome { font-weight:700; font-size:16px; }
.badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:rgba(247,169,79,.16); color:var(--arancio); margin-left:6px; font-weight:700; vertical-align:middle; }
.pillola { font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px; background:rgba(255,255,255,.10); color:var(--testo); white-space:nowrap; }
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* home: la settimana */
.sett { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin:0 0 6px; }
.sett div { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; height:62px; border-radius:16px;
            background:var(--card); border:1px solid var(--linea); }
.sett small { font-size:11px; color:var(--muto); font-weight:600; }
.sett b { font-size:16px; line-height:20px; }
.sett b.p { font-size:10px; font-weight:600; color:var(--muto); }
.sett .pass { opacity:.45; }
.sett .ok { background:var(--verde3); border-color:rgba(61,220,132,.35); }
.sett .ok b { color:var(--verde); font-size:16px; }
.sett div { cursor:pointer; }
.sett .sel { border-color:var(--verde); box-shadow:0 0 0 1px var(--verde) inset; opacity:1; }
button.dietro { font-size:34px; width:40px; min-height:44px; margin-left:-10px; color:var(--testo); padding-bottom:6px; }
.sett .oggi small { color:var(--verde); }
.conta { margin:0 4px 4px; }
.conta b { color:var(--testo); }

/* home: la seduta di oggi */
.eroe { background:linear-gradient(150deg,rgba(61,220,132,.24),rgba(61,220,132,.05) 55%,rgba(255,255,255,.04)); border-color:rgba(61,220,132,.32);
        padding:18px; border-radius:26px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
.eroe .eti { font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--verde); }
.eroe .grande { font-size:25px; font-weight:800; letter-spacing:-.4px; line-height:1.15; margin:10px 0 6px; }
.eroe .num { display:flex; gap:18px; margin:12px 0 4px; }
.eroe .num div { font-size:12px; color:var(--muto); }
.eroe .num b { display:block; font-size:22px; color:var(--testo); line-height:1.1; }
details { margin-top:12px; border-top:1px solid var(--linea); }
summary { list-style:none; cursor:pointer; padding:12px 0 4px; font-size:14px; font-weight:600; display:flex; justify-content:space-between; }
summary::-webkit-details-marker { display:none; }
summary::after { content:"⌄"; color:var(--muto); font-size:18px; line-height:1; transition:transform .2s; }
details[open] summary::after { transform:rotate(180deg); }
ol.piano { list-style:none; margin:4px 0 0; padding:0; counter-reset:n; }
ol.piano li { counter-increment:n; display:flex; align-items:center; gap:10px; margin:0; padding:8px 0; font-size:14px; border-bottom:1px solid rgba(255,255,255,.06); }
ol.piano li:last-child { border-bottom:0; }
ol.piano li::before { content:counter(n); flex:none; width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,.10); font-size:12px; font-weight:700;
                      display:flex; align-items:center; justify-content:center; }
ol.piano span { flex:1; min-width:0; }
ol.piano b { flex:none; color:var(--muto); font-weight:600; font-size:13px; font-variant-numeric:tabular-nums; }

/* home: le altre sedute */
.altre { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.altre button { display:flex; align-items:center; gap:10px; text-align:left; padding:12px; border-radius:18px; background:var(--card); min-height:64px; }
.altre i { flex:none; width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.10); font-style:normal; font-weight:800; font-size:17px;
           display:flex; align-items:center; justify-content:center; }
.altre b { display:block; font-size:14px; line-height:1.2; }
.altre small { color:var(--muto); font-size:12px; }

/* seduta */
.top { position:sticky; top:0; z-index:4; background:rgba(7,11,9,.78); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
       margin:calc(-18px - env(safe-area-inset-top)) -16px 6px; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom:1px solid var(--linea); }
.top .tit { font-size:20px; font-weight:800; letter-spacing:-.3px; }
.barra { height:6px; background:rgba(255,255,255,.10); border-radius:6px; margin-top:10px; overflow:hidden; }
.barra i { display:block; height:100%; background:linear-gradient(90deg,#2fc673,#7df0b0); border-radius:6px; transition:width .35s; }
.ex { padding:14px 8px 14px 14px; transition:border-color .2s, background .2s; }
.ex .n { flex:none; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.10); font-size:13px; font-weight:800;
         display:flex; align-items:center; justify-content:center; }
.ex .nome { flex:1; min-width:0; }
.ex .det { margin-left:36px; }
.ex.att { border-color:rgba(61,220,132,.55); background:linear-gradient(150deg,rgba(61,220,132,.16),rgba(61,220,132,.04)); box-shadow:0 8px 30px rgba(0,0,0,.3); }
.ex.att .n { background:var(--verde); color:#04130a; }
.ex.fatto { opacity:.72; }
.ex.fatto .n { background:var(--verde3); color:var(--verde); }
.ex .consiglio { color:#c4d2c9; margin-top:6px; padding:8px 10px; border-radius:12px; background:rgba(255,255,255,.06); }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.chip { min-height:42px; min-width:60px; padding:4px 12px; border-radius:21px; font-size:14px; font-variant-numeric:tabular-nums; color:var(--muto); background:rgba(255,255,255,.06); }
.chip.ok { background:var(--verde3); border-color:rgba(61,220,132,.4); color:var(--verde); font-weight:700; }
.chip.cur { border-color:var(--verde); color:var(--testo); box-shadow:0 0 0 1px var(--verde) inset; }
.chip.piu { min-width:42px; border-style:dashed; background:transparent; }

/* seduta: elenco degli esercizi (miniatura, nome, serie fatte) */
.es { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px; margin:10px 0; border-radius:20px; background:var(--card); min-height:86px; }
.mini { flex:none; width:64px; height:64px; border-radius:14px; background:#141b18 center/cover no-repeat; display:flex; align-items:center; justify-content:center;
        font-style:normal; font-weight:800; font-size:20px; color:var(--muto); }
.mini.p { width:44px; height:44px; border-radius:10px; }
.es .tx { flex:1; min-width:0; } .es b { display:block; font-size:16px; line-height:1.25; } .es small { color:var(--muto); font-size:13px; }
.es em { flex:none; font-style:normal; font-size:13px; font-weight:700; color:var(--muto); padding:4px 10px; border-radius:20px; background:rgba(255,255,255,.08); font-variant-numeric:tabular-nums; }
.es.att { border-color:rgba(61,220,132,.55); background:linear-gradient(150deg,rgba(61,220,132,.16),rgba(61,220,132,.04)); }
.es.att em { background:var(--verde); color:#04130a; }
.es.fatto em { background:var(--verde3); color:var(--verde); } .es.fatto .mini { opacity:.5; }
/* pagina del singolo esercizio: foto in due tempi, numeri, serie */
.demo { position:relative; aspect-ratio:3/2; border-radius:22px; overflow:hidden; background:#141b18; margin:0 0 14px; border:1px solid var(--linea); }
.demo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.demo img + img { animation:demo 2.4s step-end infinite; }
@keyframes demo { 0% { opacity:0; } 50% { opacity:1; } }
.serie { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px 12px; margin:8px 0; border-radius:18px; background:var(--card); min-height:56px; }
.serie i { flex:none; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.10); font-style:normal; font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; }
.serie span { flex:1; min-width:0; color:var(--muto); font-size:14px; } .serie b { font-size:18px; color:var(--testo); font-variant-numeric:tabular-nums; }
.serie small { flex:none; color:var(--muto); font-size:12px; }
.serie.ok i { background:var(--verde); color:#04130a; }
.adesso { border:1px solid rgba(61,220,132,.55); border-radius:24px; padding:12px; margin:8px 0; background:linear-gradient(150deg,rgba(61,220,132,.14),rgba(61,220,132,.03)); }
.adesso .atit { font-weight:800; font-size:17px; margin:0 4px 8px; }
.adesso .obi { white-space:normal; flex-wrap:wrap; row-gap:0; }

/* pannello fisso in basso: solo il timer di recupero */
#pan { position:fixed; left:0; right:0; bottom:calc(82px + env(safe-area-inset-bottom) + var(--su, 0px)); z-index:6; display:none; padding:0 12px; pointer-events:none; }
#pan .dentro { pointer-events:auto; max-width:440px; margin:0 auto; background:rgba(17,24,21,.86); -webkit-backdrop-filter:blur(26px) saturate(160%); backdrop-filter:blur(26px) saturate(160%);
               border:1px solid rgba(255,255,255,.14); border-radius:26px; padding:8px; box-shadow:0 12px 40px rgba(0,0,0,.55); }
#rec { display:none; align-items:center; justify-content:space-between; background:var(--verde3); border:1px solid rgba(61,220,132,.4); border-radius:18px; padding:4px 6px 4px 14px; color:var(--verde); }
#rec.fine { background:rgba(247,169,79,.16); border-color:var(--arancio); color:var(--arancio); }
#rec b { font-size:24px; font-variant-numeric:tabular-nums; margin-left:8px; color:var(--testo); }
.ptit { font-size:13px; color:var(--muto); margin:0 4px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ptit b { font-size:15px; color:var(--testo); }
.ctl { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ctl.uno { grid-template-columns:1fr; }
.st { display:grid; grid-template-columns:48px minmax(0,1fr) 48px; gap:4px; align-items:center; background:rgba(0,0,0,.30); border-radius:18px; padding:4px; }
.st button { padding:0; min-height:50px; font-size:24px; font-weight:600; border-radius:14px; }
.st input { text-align:center; font-size:24px; font-weight:800; padding:2px; min-height:50px; background:transparent; border-color:transparent; }
.st small { grid-column:1/-1; text-align:center; color:var(--muto); font-size:11px; margin-top:-4px; padding-bottom:2px; }
.ult { display:flex; gap:8px; align-items:flex-end; margin-top:10px; }
.rir { display:flex; gap:4px; }
.rir button { min-height:52px; width:36px; padding:0; font-weight:700; color:var(--muto); border-radius:12px; }
.rir button.on { background:var(--verde3); border-color:var(--verde); color:var(--verde); }
.ult .pri { flex:1; min-height:52px; font-size:17px; border-radius:16px; }
.lbl { font-size:11px; color:var(--muto); margin:0 0 3px 2px; }

/* barra in basso: vetro liquido (adattata da webgl-liquid-glass, licenza MIT) */
#nav { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom) + var(--su, 0px)); width:min(calc(100% - 24px),440px); height:60px;
       display:flex; align-items:center; padding:0 6px; border-radius:30px; z-index:7; cursor:pointer;
       -webkit-backdrop-filter:blur(40px) saturate(170%); backdrop-filter:blur(40px) saturate(170%); background:rgba(255,255,255,.11);
       box-shadow:0 8px 32px rgba(0,0,0,.40), inset 0 0 0 .5px rgba(255,255,255,.22);
       -webkit-user-select:none; user-select:none; touch-action:none; }
#nav .pill { position:absolute; top:6px; left:0; height:48px; border-radius:24px; background:rgba(255,255,255,.09); pointer-events:none;
             -webkit-backdrop-filter:brightness(1.2) saturate(1.4); backdrop-filter:brightness(1.2) saturate(1.4);
             box-shadow:inset 0 1px 1px rgba(255,255,255,.25), inset 0 -.5px 1px rgba(255,255,255,.10), 0 4px 16px rgba(0,0,0,.12);
             will-change:transform,width; transform-origin:center center; }
#nav canvas { position:absolute; top:0; left:0; width:100%; height:100%; border-radius:30px; pointer-events:none; }
#nav button, #nav .att div { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
       border:0; border-radius:24px; background:none; padding:0; min-height:48px; font-size:10.5px; line-height:1; box-shadow:none; transform:none; filter:none; }
#nav button { position:relative; z-index:1; color:rgba(255,255,255,.58); font-weight:500; }
#nav button:focus-visible { outline:none; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9); }
#nav svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
#nav .att { position:absolute; inset:0; display:flex; align-items:center; padding:0 6px; pointer-events:none; z-index:2;
            -webkit-clip-path:url(#navClip); clip-path:url(#navClip); }
#nav .att div { color:var(--verde); font-weight:700; }
#nav .att svg { stroke-width:2.3; }

/* home v15: saluto, prossima seduta con foto, i quattro numeri di oggi con l'anello */
.saluto { margin-bottom:14px; } .saluto h1 { margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .saluto .avatar { cursor:pointer; }
.hero { position:relative; border-radius:28px; overflow:hidden; border:1px solid rgba(61,220,132,.32); background:#141b18 center/cover no-repeat; padding:18px; margin:14px 0 4px; box-shadow:0 12px 40px rgba(0,0,0,.4); }
.hero::before { content:""; position:absolute; inset:0; background:linear-gradient(165deg,rgba(7,11,9,.50),rgba(7,11,9,.90) 62%,rgba(7,11,9,.96)); }
.hero > * { position:relative; }
.hero .eti { font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--verde); }
.hero .grande { font-size:30px; font-weight:800; letter-spacing:-.6px; line-height:1.1; margin:26px 0 6px; }
.hero .sotto { font-size:14px; color:#d3ded7; }
.fila { display:flex; align-items:center; margin-top:14px; } .fila .mini { margin-right:-8px; border:2px solid #0c120f; } .fila span { margin-left:18px; font-size:13px; font-weight:700; color:#d3ded7; }
.dato { display:flex; flex-direction:column; align-items:stretch; gap:4px; text-align:left; padding:14px; border-radius:24px; background:var(--card); border:1px solid var(--linea); min-height:138px; color:var(--testo); }
.dato small { color:var(--muto); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; }
.dato > b { font-size:27px; line-height:1.1; letter-spacing:-.6px; font-variant-numeric:tabular-nums; margin-top:auto; white-space:nowrap; }
.dato u { text-decoration:none; font-size:13px; font-weight:600; color:var(--muto); letter-spacing:0; }
.dato em { font-style:normal; font-size:12px; color:var(--muto); } .dato em.fai { color:var(--verde); font-weight:700; }
.dato .tondo { width:38px; min-height:38px; font-size:21px; }
.anello { flex:none; width:44px; height:44px; transform:rotate(-90deg); } .af { fill:none; stroke:rgba(255,255,255,.10); stroke-width:5; } .av { fill:none; stroke-width:5; stroke-linecap:round; }
.blocco.avv { border-color:rgba(247,169,79,.45); } .blocco.avv i { background:rgba(247,169,79,.16); color:var(--arancio); }
input.numerone { font-size:34px; font-weight:800; text-align:center; min-height:76px; margin-top:14px; letter-spacing:-.5px; }
#nav.nuovo > button:last-of-type::after { content:""; position:absolute; top:7px; left:calc(50% + 7px); width:9px; height:9px; border-radius:50%; background:var(--arancio); box-shadow:0 0 0 2px rgba(7,11,9,.6); }
/* v16: riquadro largo del sonno, righe della spesa, foto dei progressi */
.dato.largo2 { grid-column:1/-1; min-height:0; }
.pasto li.volte { align-items:center; gap:10px; } .pasto li.volte span { flex:1; min-width:0; } .pasto li.volte b { min-width:22px; text-align:center; font-size:17px; }
.pasto li.volte .tondo { width:38px; min-height:38px; font-size:20px; }
.fig.uno { grid-template-columns:1fr; max-width:320px; margin-left:auto; margin-right:auto; }
img.prog { aspect-ratio:3/4; object-fit:cover; background:#141b18; color:var(--muto); font-size:12px; }
/* home v17: i due ingressi con la barra di avanzamento, e le liste dentro una sola scheda */
.foto { height:176px; } .foto .barra { display:block; height:4px; margin:7px 0 5px; background:rgba(255,255,255,.22); } .foto .barra i { height:4px; }
.foto small { display:block; }
.lista { padding:2px 14px; }
.voceH { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid rgba(255,255,255,.07); border-radius:0; padding:12px 0; min-height:62px; }
.voceH:last-child { border-bottom:0; }
.voceH > i { flex:none; width:38px; height:38px; border-radius:12px; background:var(--verde3); color:var(--verde); display:flex; align-items:center; justify-content:center; }
.voceH svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.voceH span { flex:1; min-width:0; } .voceH b { display:block; font-size:15px; } .voceH small { color:var(--muto); font-size:12.5px; }
.voceH em { flex:none; font-style:normal; font-size:24px; color:var(--muto); line-height:1; padding-bottom:3px; }
.dato .tondo.piu { background:var(--verde); color:#04130a; }
/* foglio dal basso e avvisi */

/* v18: movimento (pagine, fogli, anelli), schermata di avvio, grafici di dettaglio, torta dei macro, fine seduta */

         background:radial-gradient(70% 50% at 30% 18%, #1c4a33, #0c1712 55%, #070b09); animation:avvioVia .35s ease-in .65s forwards; }

.tess div.oro { background:var(--verde3); border-color:rgba(61,220,132,.45); color:var(--verde); } .tess div.oro b { color:var(--verde); }
.macro { display:flex; align-items:center; gap:16px; margin-top:14px; padding-top:14px; border-top:1px solid var(--linea); }

.festa { display:flex; justify-content:center; margin:6px 0 2px; } .festa svg { width:84px; height:84px; }

/* v21: identità. Carattere dei titoli e dei numeri (Archivo, largo e pesante, in font/), zone più luminose e un solo accento,

/* Le fasi si contano in settimane di allenamento, non in date: la settimana 1 è quella della prima seduta di pesi,

  const l = lunSett(d), viste = {};
  for (const x of S.sedute) if (["A", "B", "C"].includes(x.tipo) && x.data < l) viste[lunSett(x.data)] = 1;

/* ============ ARCHIVIO (solo su questo telefono) ============ */

const $ = (id) => document.getElementById(id);

  const c = {};
  for (const k in SEDUTE) for (const e of SEDUTE[k].es) if (!c[e.id]) c[e.id] = e;
  for (const s of S.sedute) for (const e of s.es) if (!c[e.id]) c[e.id] = { id: e.id, nome: e.nome, serie: 3, rip: "8-12", t: "m", p: 2.5, u: e.u || "", nota: "" };

}

  for (let i = S.sedute.length - 1; i >= 0; i--) {
    const s = S.sedute[i]; if (s.id === salta) continue;
    const e = s.es.find((x) => x.id === idEs);

  if (!u || e.u || e.nokg) return false;

/* ============ v18: MOVIMENTO ============
   CALMO: il telefono chiede meno animazioni, e allora non si muove niente. vib: vibrazione breve sui tasti principali.

const CALMO = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

function testoCoach(da) {
  let t = "";

    t += `## ${s.data} — ${s.nome}${s.minuti ? " (" + s.minuti + " min)" : ""}\n`;
    for (const e of s.es) t += `- ${e.nome}: ${testoSerie(e, e.serie)}${rirTesto(e)}\n`;
    if (s.pronto) t += `Readiness (sonno/energia/dolori/stress/voglia): ${s.pronto.v.join("/")} = ${s.pronto.tot} ${s.pronto.col}${s.pronto.piena ? ", seduta piena per scelta" : ""}\n`;
    t += `Note: ${s.note || ""}\n\n`;
  }
  const dd = Object.keys(S.diario).filter((d) => d > da).sort();
  if (dd.length) {
    t += "Diario (data | peso kg | passi | sonno 1-5 | risvegli | giro vita cm | note)\n";
    for (const d of dd) { const x = S.diario[d]; t += `${d} | ${it(x.peso)} | ${it(x.passi)} | ${it(x.sonno)} | ${it(x.risvegli)} | ${it(x.vita)} | ${x.note || ""}\n`; }
  }
  const tt = ((S.trazione || {}).test || []).filter((x) => x.d > da);
  if (tt.length) { t += "\nTest trazione (data | trazioni complete | negativa più lenta in secondi)\n"; for (const x of tt) t += `${x.d} | ${it(x.n)} | ${it(x.s)}\n`; }
  const cMis = COL_MIS.filter((c) => c[0] !== "vita"), mm = dd.filter((d) => cMis.some((c) => S.diario[d][c[0]] != null));
  if (mm.length) {
    t += "\nMisure del corpo in cm (data | " + cMis.map((c) => c[2]).join(" | ") + ")\n";
    for (const d of mm) t += d + " | " + cMis.map((c) => it(S.diario[d][c[0]])).join(" | ") + "\n";
  }
  const ff = (S.foto || []).filter((x) => x.d > da);
  if (ff.length) t += "\nFoto dei progressi scattate nell'app (te le mando a parte): " + ff.map((x) => x.d + " " + x.posa).join(", ") + "\n";
  const cc = Object.keys(S.cibo || {}).filter((d) => d > da).sort().filter((d) => totali(d)[0] > 0 || S.cibo[d].acqua);
  if (cc.length) {
    t += "\nAlimentazione spuntata nell'app (data | giorno | kcal | proteine g | carboidrati g | grassi g | fibra g | acqua L)\n";
    for (const d of cc) { const x = totali(d); t += `${d} | ${APP.onoff ? (modoOn(d) ? "ON" : "OFF") : "piano"}${S.cibo[d].pers ? " personalizzato" : ""} | ${Math.round(x[0])} | ${Math.round(x[1])} | ${Math.round(x[2])} | ${Math.round(x[3])} | ${Math.round(x[4])} | ${litri(S.cibo[d].acqua || 0)}\n`;
      const sc = [], fuori = [];
      for (const p of MENU) { const vv = ["p", "c", "g", "v"].flatMap((z) => slotDi(S.cibo[d], p.id + "." + z)); if (vv.length) sc.push(p.nome + ": " + vv.map((y) => nomeA(y).split(",")[0].split(" (")[0] + " " + qtaA(y) + (y.x ? "*" : "")).join(", "));
        for (const y of vv) if (y.x) fuori.push(y.x.nome + " " + qtaA(y) + " (" + Math.round(vecA(y)[0]) + " kcal, " + p.nome.toLowerCase() + ")"); }
      if (sc.length) t += "  scelte: " + sc.join("; ") + "\n";
      if (fuori.length) t += "  fuori piano: " + fuori.join("; ") + "\n";
      if ((S.cibo[d].extra || []).length) t += `  fuori piano: ${S.cibo[d].extra.map((e) => e.nome + " " + e.q + " (" + Math.round(e.v[0]) + " kcal" + (PASTI.some((p) => p.id === e.pasto) ? ", " + PASTI.find((p) => p.id === e.pasto).nome.toLowerCase() : "") + (e.sost ? ", al posto di " + e.sost : "") + ")").join("; ")}\n`; }
  }
  return t.trim();
}

/* ---- foto dei progressi: restano sul telefono, in IndexedDB (troppo grandi per localStorage). S.foto = [{d, posa}] è l'indice ---- */
const POSE = [["fronte", "Fronte"], ["lato", "Lato"], ["retro", "Retro"]];

function apriFoto() { chiudi(); tab = "diario"; vistaFoto = true; disegna(); window.scrollTo(0, 0); }
function chiudiFoto() { vistaFoto = false; disegna(); window.scrollTo(0, 0); }
function apriDb() {

    const r = indexedDB.open("taccuino-umberto-foto", 1); r.onupgradeneeded = () => r.result.createObjectStore("foto");
    r.onsuccess = () => ok((dbFoto = r.result)); r.onerror = () => no(r.error);

}
const dbOp = (modo, f) => apriDb().then((db) => new Promise((ok, no) => { const t = db.transaction("foto", modo), q = f(t.objectStore("foto")); t.oncomplete = () => ok(q.result); t.onerror = () => no(t.error); t.onabort = () => no(t.error); }));
function vFoto() {
  const nomePosa = POSE.find((p) => p[0] === posaSel)[1].toLowerCase(), L = (S.foto || []).filter((x) => x.posa === posaSel).sort((a, b) => (a.d < b.d ? -1 : 1)), ult = L[L.length - 1], pr = L.length > 1 ? L[0] : null;
  const dataLunga = (d) => dataIt(d) + "/" + d.slice(2, 4), im = (x, eti) => `<div><img class="prog" data-k="${x.d}-${x.posa}" alt=""><b>${eti}</b>${dataLunga(x.d)}</div>`;
  let h = `<div class="riga testata">${freccia("chiudiFoto()")}<div><div class="sopra">Peso e misure</div><h1>Foto dei progressi</h1></div></div>
    <div class="tre3c">${POSE.map((p) => `<button class="${p[0] === posaSel ? "pri" : ""}" onclick="posaSel='${p[0]}';disegna()">${p[1]}</button>`).join("")}</div>`;
  h += ult ? `<div class="fig ${pr ? "" : "uno"}">${pr ? im(pr, "Prima") : ""}${im(ult, pr ? "Adesso" : "Prima foto")}</div>`
    : `<div class="card vuoto"><b>Nessuna foto di ${nomePosa}</b>Stessa luce, stessa distanza, stesso punto della stanza. Al mattino, a digiuno, braccia rilassate.</div>`;
  h += `<button class="pri largo grosso" onclick="$('fIn').click()">Aggiungi la foto di oggi · ${nomePosa}</button><input type="file" id="fIn" accept="image/*" style="display:none" onchange="nuovaFoto(this)">`;
  if (L.length) h += `<h2>Tutte · ${nomePosa}</h2><div class="card">` + L.slice().reverse().map((x) => `<div class="rr"><span>${nomeGiorno(x.d)} ${dataLunga(x.d)}</span>
      <span class="riga"><button class="pic" onclick="condividiFoto('${x.d}-${x.posa}')">Invia</button><button class="ico" aria-label="Elimina" onclick="togliFoto('${x.d}','${x.posa}')">✕</button></span></div>`).join("") + `</div>`;
  return h + `<p class="muto">Le foto restano solo su questo telefono: non vanno su internet e non entrano nella copia di sicurezza. Per farle vedere al coach tocca "Invia" e mandale in chat. Le tre pose ogni 4 settimane.</p>`;
}
function caricaFoto() {
  document.querySelectorAll("img[data-k]").forEach((el) => {
    const k = el.dataset.k; if (urlFoto[k]) { el.src = urlFoto[k]; return; }
    dbOp("readonly", (st) => st.get(k)).then((b) => { if (!b) { el.alt = "Foto non presente su questo telefono"; return; } urlFoto[k] = URL.createObjectURL(b); el.src = urlFoto[k]; }).catch(() => {});
  });
}
function nuovaFoto(inp) {

  im.onload = () => {
    const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
    c.toBlob((b) => { if (b) salvaFoto(b, posaSel, oggi()); else avvisa("Non riesco a leggere la foto"); }, "image/jpeg", 0.85);

function togliFoto(d, posa) {
  if (!confirm("Elimino la foto del " + dataIt(d) + "?")) return; const k = d + "-" + posa;
  dbOp("readwrite", (st) => st.delete(k)).catch(() => {}).then(() => { delete urlFoto[k]; S.foto = (S.foto || []).filter((x) => !(x.d === d && x.posa === posa)); salva(); disegna(); });
}
async function condividiFoto(k) {
  try {
    const b = await dbOp("readonly", (st) => st.get(k)); if (!b) { avvisa("Foto non presente su questo telefono"); return; }
    const f = new File([b], k + ".jpg", { type: "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: k }); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = k + ".jpg"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) {}
}

/* ============ v18: GRAFICI DI DETTAGLIO, TORTA DEI MACRO, COSTANZA, RIEPILOGO DELLA SETTIMANA ============ */
/* ---- passi, acqua, sonno: barre degli ultimi 7 o 30 giorni con la linea del traguardo; il dito sul grafico mostra il giorno ---- */
const DETT = {
  passi: { t: "Passi", rif: PASSI_MIN, tg: "minimo " + mila(PASSI_MIN) + " al giorno", val: (g) => (S.diario[g] || {}).passi, fmt: (v) => mila(v), un: "passi", segna: "segna('passi')", lab: "Segna i passi" },
  acqua: { t: "Acqua", rif: ACQUA_ML / 1000, tg: "traguardo " + litri(ACQUA_ML) + " litri al giorno", val: (g) => { const a = ((S.cibo || {})[g] || {}).acqua; return a ? a / 1000 : null; }, fmt: (v) => litri(v * 1000), un: "L" },
  sonno: { t: "Sonno", rif: 4, tg: "una buona notte è da 4 in su", val: (g) => (S.diario[g] || {}).sonno, fmt: (v) => it(parseFloat(v.toFixed(1))), un: "su 5", segna: "segnaSonno()", lab: "Segna la notte",
    piu: (g) => { const r = (S.diario[g] || {}).risvegli; return r == null ? "" : " · " + (r >= 4 ? "4 o più" : r) + (r === 1 ? " risveglio" : " risvegli"); } },
};
let DET = { k: "passi", n: 7 };
function dettaglio(k, n) {
  DET = { k: k || DET.k, n: n || DET.n }; const M = DETT[DET.k], d = oggi(), pts = [];
  for (let i = DET.n - 1; i >= 0; i--) { const g = meno(d, i), v = M.val(g); pts.push({ x: nomeGiorno(g) + " " + dataIt(g), y: v == null ? null : v, g }); }
  const vv = pts.filter((p) => p.y != null).map((p) => p.y), m = vv.length ? vv.reduce((a, b) => a + b, 0) / vv.length : null, ok = vv.filter((v) => v >= M.rif).length;
  apri(testaFoglio(M.t) + `<p class="muto" style="margin:2px 0 12px">Ultimi ${DET.n} giorni · ${M.tg}</p>
    <div class="g2"><button class="pic ${DET.n === 7 ? "pri" : ""}" onclick="dettaglio('${DET.k}',7)">7 giorni</button><button class="pic ${DET.n === 30 ? "pri" : ""}" onclick="dettaglio('${DET.k}',30)">30 giorni</button></div>
    <div class="tess tre"><div><b>${m == null ? "–" : M.fmt(m)}</b>media ${M.un}</div><div><b>${ok}<span class="muto"> / ${vv.length}</span></b>giorni al traguardo</div><div><b>${vv.length ? M.fmt(Math.max(...vv)) : "–"}</b>il migliore</div></div>` +
    (vv.length ? grafBarre("det", pts, { rif: M.rif, spento: true, testo: (p) => (p.y == null ? "non segnato" : M.fmt(p.y) + " " + M.un + (M.piu ? M.piu(p.g) : "")) }) +
      `<div class="leg"><span><i class="ll" style="background:rgba(255,255,255,.45)"></i>traguardo</span><span>barra piena: traguardo raggiunto</span></div><p class="muto">Tieni il dito sul grafico per leggere un giorno.</p>`
      : `<p class="vuoto"><b>Ancora nessun dato</b>Il grafico compare dal primo giorno segnato.</p>`) +
    (M.segna ? `<button class="pri largo" onclick="${M.segna}">${M.lab}</button>` : "") + `<button class="largo" onclick="chiudi()">Chiudi</button>`, true);
}

/* ---- torta dei macro: come si dividono le calorie tra proteine, carboidrati e grassi (tre toni di verde, un solo colore d'accento) ---- */
function torta(T, N) {
  const col = ["#3ddc84", "#c9f7dd", "#1f8f55"], nomi = ["Proteine", "Carboidrati", "Grassi"], k = (p, c, g) => [p * 4, c * 4, g * 9];
  const piano = k(N.p, N.c, N.g), fatto = k(T[1], T[2], T[3]), vuoto = fatto[0] + fatto[1] + fatto[2] < 1, v = vuoto ? piano : fatto;
  const tot = v[0] + v[1] + v[2], tp = piano[0] + piano[1] + piano[2]; let da = 0, c = "";
  v.forEach((x, i) => { const q = (x / tot) * 100; if (q > 0.5) c += `<circle cx="21" cy="21" r="15.915" stroke="${col[i]}" stroke-dasharray="${Math.max(0, q - 1.2).toFixed(2)} ${(100 - Math.max(0, q - 1.2)).toFixed(2)}" stroke-dashoffset="${(-da).toFixed(2)}"/>`; da += q; });
  return `<div class="macro"><svg class="torta" viewBox="0 0 42 42" role="img" aria-label="Divisione delle calorie tra i macronutrienti">${c}</svg>
    <div class="legm"><div class="muto" style="font-size:12px">${vuoto ? "Come si dividono le calorie del piano" : "Da dove vengono le calorie di oggi"}</div>` +
    v.map((x, i) => `<div><i style="background:${col[i]}"></i><span>${nomi[i]}</span><b>${Math.round((x / tot) * 100)}%</b>${vuoto ? "" : `<small>piano ${Math.round((piano[i] / tp) * 100)}%</small>`}</div>`).join("") + `</div></div>`;
}

/* ---- costanza: settimane di fila con le 3 sedute di pesi, giorni di fila con il peso segnato ---- */
const pesiSett = (lun) => { const dom = meno(lun, -6); return S.sedute.filter((s) => s.data >= lun && s.data <= dom && APP.pesi.includes(s.tipo)).length; };
const lunediDi = (d) => meno(d, (new Date(d + "T12:00").getDay() + 6) % 7);
function costanza() {
  const d = oggi(), lun = lunediDi(d), questa = pesiSett(lun);
  let sett = questa >= APP.nSett ? 1 : 0; for (let l = meno(lun, 7), i = 0; i < 520 && pesiSett(l) >= APP.nSett; l = meno(l, 7), i++) sett++;      // la settimana in corso non interrompe la serie
  let settRec = sett; if (S.sedute.length) { let run = 0; for (let l = lunediDi(S.sedute[0].data); l <= lun; l = meno(l, -7)) { run = pesiSett(l) >= APP.nSett ? run + 1 : 0; settRec = Math.max(settRec, run); } }
  const haPeso = (g) => (S.diario[g] || {}).peso != null;
  let peso = 0; for (let g = haPeso(d) ? d : meno(d, 1); haPeso(g); g = meno(g, 1)) peso++;
  let pesoRec = peso, run = 0, prec = null;
  for (const g of Object.keys(S.diario).filter(haPeso).sort()) { run = prec && meno(g, 1) === prec ? run + 1 : 1; pesoRec = Math.max(pesoRec, run); prec = g; }
  return { sett, settRec, peso, pesoRec, questa, lun };
}
function apriCostanza() {
  const K = costanza(); let w = "";
  for (let i = 7; i >= 0; i--) { const n = pesiSett(meno(K.lun, 7 * i)); w += `<div class="${n >= APP.nSett ? "ok" : ""}">${n >= APP.nSett ? "✓" : n}</div>`; }
  apri(testaFoglio("La tua costanza") + `<div class="tess grande"><div class="${K.sett ? "oro" : ""}"><b>${cnt(K.sett, K.sett)}</b>${K.sett === 1 ? "settimana" : "settimane"} di fila con ${APP.nSett} sedute</div><div><b>${cnt(K.settRec, K.settRec)}</b>il tuo record di settimane</div>
      <div class="${K.peso ? "oro" : ""}"><b>${cnt(K.peso, K.peso)}</b>${K.peso === 1 ? "giorno" : "giorni"} di fila con il peso</div><div><b>${cnt(K.pesoRec, K.pesoRec)}</b>il tuo record di giorni</div></div>
    <h2>Ultime 8 settimane</h2><div class="settimane">${w}</div><p class="muto">Sedute di pesi per settimana, a destra quella in corso (${K.questa} di ${APP.nSett}). Finché non è finita, la settimana in corso non interrompe la serie.</p>
    <p class="muto">Per il peso bastano 3-4 pesate a settimana: la serie di giorni è un di più, non un obbligo.</p><button class="largo" onclick="chiudi()">Chiudi</button>`);
  muovi($("foglio"), null);
}

/* ---- riepilogo della settimana: la domenica compare in home tra le cose da fare; dalla voce Coach si apre sempre (fuori dalla domenica mostra la settimana scorsa) ---- */
function datiSett(lun) {
  const gg = []; for (let i = 0; i < 7; i++) gg.push(meno(lun, -i));
  const med = (f) => { const v = gg.map(f).filter((x) => x != null); return v.length ? { m: v.reduce((a, b) => a + b, 0) / v.length, n: v.length } : null; };
  const dia = (k) => med((g) => (S.diario[g] || {})[k]), prima = media(meno(lun, 8), meno(lun, 1));
  const tipi = S.sedute.filter((s) => s.data >= lun && s.data <= gg[6] && APP.pesi.includes(s.tipo)).map((s) => s.tipo);
  const cibo = gg.filter((g) => (S.cibo || {})[g] && totali(g)[0] > 0).map((g) => { const t = totali(g), N = CIBO[modoOn(g) ? "on" : "off"]; return { kcal: t[0], p: t[1], ok: Math.abs(t[0] - N.kcal) <= N.kcal * 0.1 }; });
  return { lun, dom: gg[6], tipi, peso: dia("peso"), prima, passi: dia("passi"), sonno: dia("sonno"), acqua: med((g) => { const a = ((S.cibo || {})[g] || {}).acqua; return a ? a / 1000 : null; }),
    cibo: cibo.length ? { n: cibo.length, ok: cibo.filter((x) => x.ok).length, p: cibo.reduce((a, x) => a + x.p, 0) / cibo.length, kcal: cibo.reduce((a, x) => a + x.kcal, 0) / cibo.length } : null };
}
const segno = (v, dec) => (v >= 0 ? "+" : "−") + it(Math.abs(v).toFixed(dec));
function testoSett(W) {
  const r = [`Riepilogo settimana ${W.lun} / ${W.dom}`, `Sedute di pesi: ${W.tipi.length} su ${APP.nSett}${W.tipi.length ? " (" + W.tipi.join(", ") + ")" : ""}`];
  r.push("Peso medio: " + (W.peso ? `${it(W.peso.m.toFixed(1))} kg (${W.peso.n} pesate)` + (W.prima ? `, ${segno(W.peso.m - W.prima.m, 2)} kg sulla settimana prima` : "") : "nessuna pesata"));
  r.push("Passi medi: " + (W.passi ? `${mila(W.passi.m)} (${W.passi.n} giorni)` : "non segnati"));
  r.push("Sonno medio: " + (W.sonno ? `${it(W.sonno.m.toFixed(1))} su 5 (${W.sonno.n} notti)` : "non segnato"));
  r.push("Alimentazione: " + (W.cibo ? `${W.cibo.n} giorni spuntati, ${W.cibo.ok} entro il 10% delle calorie del giorno, media ${Math.round(W.cibo.kcal)} kcal e ${Math.round(W.cibo.p)} g di proteine` : "niente spuntato"));
  r.push("Acqua media: " + (W.acqua ? `${it(W.acqua.m.toFixed(1))} L (${W.acqua.n} giorni)` : "non segnata"));
  return r.join("\n");
}
function riepSett() {
  const d = oggi(), dom = new Date(d + "T12:00").getDay() === 0, W = datiSett(dom ? lunediDi(d) : meno(lunediDi(d), 7)), n = W.tipi.length;
  const rr = (t, s, b, cl) => `<div class="rr"><span>${t}<small>${s}</small></span><b class="${cl || ""}">${b}</b></div>`;
  apri(`<div class="riga tra"><div><div class="sopra">${dom ? "Questa settimana" : "La settimana scorsa"}</div><div class="nome" style="font-size:21px">${nomeGiorno(W.lun)} ${dataIt(W.lun)} – ${nomeGiorno(W.dom)} ${dataIt(W.dom)}</div></div><button class="ico" aria-label="Chiudi" onclick="chiudi()">✕</button></div>
    <div class="tess grande"><div class="${n >= APP.nSett ? "oro" : ""}"><b>${cnt(n, n)} <u>/ ${APP.nSett}</u></b>sedute di pesi</div>
      <div><b>${W.peso ? cnt(W.peso.m.toFixed(1), it(W.peso.m.toFixed(1)), 1) + " <u>kg</u>" : "–"}</b>peso medio${W.peso && W.prima ? " · " + segno(W.peso.m - W.prima.m, 2) + " kg" : ""}</div>
      <div class="${W.passi && W.passi.m >= PASSI_MIN ? "oro" : ""}"><b>${W.passi ? cnt(Math.round(W.passi.m), mila(W.passi.m), 0, 1) : "–"}</b>passi al giorno, in media</div>
      <div><b>${W.sonno ? cnt(W.sonno.m.toFixed(1), it(W.sonno.m.toFixed(1)), 1) + " <u>su 5</u>" : "–"}</b>sonno medio</div></div>
    <div class="card">` +
      rr("Alimentazione", W.cibo ? `${W.cibo.n} giorni spuntati · media ${Math.round(W.cibo.kcal)} kcal · proteine ${Math.round(W.cibo.p)} g` : "nessun giorno spuntato nell'app", W.cibo ? W.cibo.ok + " su " + W.cibo.n + " nel traguardo" : "–", W.cibo && W.cibo.ok >= W.cibo.n - 1 ? "su" : "") +
      rr("Pesate", "ne servono 3-4 a settimana per leggere l'andamento", (W.peso ? W.peso.n : 0) + " su 4", W.peso && W.peso.n >= 3 ? "su" : "") +
      rr("Acqua", "traguardo " + litri(ACQUA_ML) + " litri al giorno", W.acqua ? it(W.acqua.m.toFixed(1)) + " L di media" : "–", W.acqua && W.acqua.m >= ACQUA_ML / 1000 ? "su" : "") + `</div>
    <p class="muto">"Nel traguardo" vuol dire entro il 10% delle calorie del giorno, su quello che hai spuntato.</p>
    <button class="pri largo" onclick="inviaSett('${W.lun}')">Invia il riepilogo al coach</button><button class="largo" onclick="chiudi()">Chiudi</button>`, true);
  muovi($("foglio"), null);
}
async function inviaSett(lun) {
  const t = testoSett(datiSett(lun)); let fatto = false;
  if (navigator.share) { try { await navigator.share({ title: "Riepilogo della settimana", text: t }); fatto = true; } catch (e) {} }
  else { try { await navigator.clipboard.writeText(t); avvisa("Copiato: incollalo nella chat"); fatto = true; } catch (e) { avvisa("Non riesco a copiare"); } }
  if (fatto) { S.riepSett = lun; salva(); chiudi(); disegna(); }
}

/* ============ TASTO INDIETRO DEL TELEFONO ============
   Si tiene sempre una voce in più nella cronologia: il tasto indietro la consuma, l'app chiude ciò che è aperto
   e la rimette. Solo dalla home, senza nulla di aperto, il tasto esce dall'app. */
function passoIndietro() {
  if (foglioSu) { chiudi(); return true; }
  if (tab === "allena" && S.corso && esAperto != null) { chiudiEs(); return true; }
  if (tab === "allena" && S.corso) { indietro(); return true; }
  if (tab === "tecnica" && guida) { apriGuida(null); return true; }
  if (tab === "diario" && vistaFoto) { chiudiFoto(); return true; }
  if (tab !== "allena") { vai("allena"); return true; }
  if (sub) { apriSub(sub === "spesa" || sub === "prep" || sub === "integ" ? "cibo" : null); return true; }
  return false;
}
/* La cronologia del browser tiene una voce per ogni livello aperto (scheda della barra, pagina, foglio): le voci nascono
   mentre tocchi lo schermo, perché Chrome su Android salta al tasto indietro quelle create senza un tocco.
   livelli(): quanti livelli sono aperti adesso. allinea(): porta la cronologia a quel numero, dopo ogni disegno. */
function livelli() {
  let n = 0;
  if (tab !== "allena") n++; else if (S.corso) n += esAperto != null ? 2 : 1; else if (sub) n += sub === "spesa" || sub === "prep" || sub === "integ" ? 2 : 1;
  if (tab === "tecnica" && guida) n++;
  if (tab === "diario" && vistaFoto) n++;
  if (foglioSu) n++;
  return n;
}
let profondo = 0, saltaPop = 0, inCoda = false;
function allinea() {
  if (inCoda) return; inCoda = true;
  Promise.resolve().then(() => {
    inCoda = false; const n = livelli();
    try {
      while (profondo < n) history.pushState({ app: ++profondo }, "");
      if (profondo > n) { const giu = profondo - n; profondo = n; saltaPop++; history.go(-giu); }
    } catch (e) {}
  });
}
window.addEventListener("popstate", () => {
  if (saltaPop > 0) { saltaPop--; return; }        // passo indietro fatto dall'app stessa, per restare allineata
  if (profondo > 0) profondo--;
  passoIndietro(); allinea();
});

disegna(); sveglio();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
